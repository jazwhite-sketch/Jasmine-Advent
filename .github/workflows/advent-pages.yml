name: Adventskalender veröffentlichen

on:
  push:
    paths:
      - "index.html"
      - "fotos/**"
      - "scripts/astrowoche.py"
      - ".github/workflows/advent-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 0,6,12,18,23 * 12 *"
    - cron: "17 23 30 11 *"

permissions:
  contents: read

concurrency:
  group: advent-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Kalender mit aktueller Horoskopvorschau vorbereiten
        run: |
          mkdir _site
          cp index.html _site/
          if [ -d fotos ]; then cp -R fotos _site/; fi
          python3 scripts/astrowoche.py _site/astrowoche-heute.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages aktualisieren
        id: deployment
        uses: actions/deploy-pages@v4
